name: ${UMBRA_PROJECT_NAME:-umbra}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umbra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umbra_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-umbra}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 15s

  minio:
    image: ${UMBRA_PROJECT_NAME:-umbra}-minio:source-2025-09-07
    pull_policy: never
    build:
      context: ./scripts
      dockerfile: Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-umbra_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-umbra_dev_only_password}
      S3_BUCKET: ${S3_BUCKET:-umbra-dev}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-19000}:9000"
      - "${DEV_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    stop_grace_period: 15s

volumes:
  postgres_data:
  minio_data:
